name: Build & Deploy Website
on:
  push:
    branches: [ master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # There is no published action for cobalt, so it is fetched by release URL and
      # the version pinned here.
      COBALT_VERSION: 0.20.4
    steps:
      - uses: actions/checkout@v7
      - name: Install Cobalt
        # Unpacked outside the checkout: the tarball carries its own docs, which cobalt would
        # otherwise pick up and try to build as part of the site.
        working-directory: ${{ runner.temp }}
        run: |
          wget "https://github.com/cobalt-org/cobalt.rs/releases/download/v$COBALT_VERSION/cobalt-v$COBALT_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf cobalt-*.tar.gz
          sudo mv cobalt /usr/local/bin/
      # CNAME sits in the source and cobalt copies it into _site with everything else.
      - name: Build Cobalt site
        run: cobalt build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
